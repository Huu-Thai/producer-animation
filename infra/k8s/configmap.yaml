apiVersion: v1
kind: ConfigMap
metadata:
  name: producer-animation-config
  namespace: producer-animation
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # Service URLs
  API_URL: "http://api-service:3001"
  WORKFLOW_ENGINE_URL: "http://workflow-engine-service:3002"
  AI_GATEWAY_URL: "http://ai-gateway-service:3003"
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Database
  DATABASE_URL: "postgresql://postgres:$(DB_PASSWORD)@pgbouncer-service:5432/producer_animation?pgbouncer=true"
  # Celery
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"
  FLOWER_URL: "http://flower-service:5555"
  # Feature flags
  VOICE_CACHE_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "3"
  CIRCUIT_BREAKER_TIMEOUT: "30000"
