version: "3.9"

# Production reference docker-compose
# Use this as reference for K8s manifests or for single-server deployments
# Environment variables must be provided via .env.production

services:
  api:
    image: ghcr.io/your-org/producer-animation-api:latest
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WORKFLOW_ENGINE_URL: http://workflow-engine:3002
      CORS_ORIGIN: ${CORS_ORIGIN}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  workflow-engine:
    image: ghcr.io/your-org/producer-animation-workflow-engine:latest
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      API_URL: http://api:3001
      AI_GATEWAY_URL: http://ai-gateway:3003
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-gateway:
    image: ghcr.io/your-org/producer-animation-ai-gateway:latest
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WORKFLOW_ENGINE_URL: http://workflow-engine:3002
      FLOWER_URL: http://flower:5555
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy

  ai-workers:
    image: ghcr.io/your-org/producer-animation-ai-workers:latest
    restart: always
    command: celery -A celery_app worker --loglevel=info -Q image,motion,voice,render,publish -c 4
    environment:
      CELERY_BROKER_URL: redis://${REDIS_HOST}:6379/1
      CELERY_RESULT_BACKEND: redis://${REDIS_HOST}:6379/2
      DATABASE_URL: ${DATABASE_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LEONARDO_API_KEY: ${LEONARDO_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      WORKFLOW_ENGINE_URL: http://workflow-engine:3002
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/your-org/producer-animation-ai-workers:latest
    restart: always
    command: celery -A celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://${REDIS_HOST}:6379/1
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: ghcr.io/your-org/producer-animation-ai-workers:latest
    restart: always
    command: celery -A celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://${REDIS_HOST}:6379/1
    ports:
      - "5555:5555"

  web:
    image: ghcr.io/your-org/producer-animation-web:latest
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "3000:3000"

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
