name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/producer-animation

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api
            context: apps/api
          - name: workflow-engine
            context: apps/workflow-engine
          - name: ai-gateway
            context: apps/ai-gateway
          - name: ai-workers
            context: apps/ai-workers
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile || format('{0}/Dockerfile', matrix.service.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Run database migrations
        run: |
          kubectl run migration-${{ github.sha }} \
            --image=${{ env.IMAGE_PREFIX }}-api:${{ github.sha }} \
            --namespace=producer-animation \
            --restart=Never \
            --rm \
            --attach \
            --env="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            -- pnpm --filter @producer/db migrate:deploy

      - name: Deploy services
        run: |
          IMAGE_TAG=${{ github.sha }}
          kubectl set image deployment/api api=${{ env.IMAGE_PREFIX }}-api:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/workflow-engine workflow-engine=${{ env.IMAGE_PREFIX }}-workflow-engine:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/ai-gateway ai-gateway=${{ env.IMAGE_PREFIX }}-ai-gateway:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/ai-workers ai-workers=${{ env.IMAGE_PREFIX }}-ai-workers:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/web web=${{ env.IMAGE_PREFIX }}-web:$IMAGE_TAG -n producer-animation

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n producer-animation --timeout=5m
          kubectl rollout status deployment/workflow-engine -n producer-animation --timeout=5m
          kubectl rollout status deployment/web -n producer-animation --timeout=5m

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Run database migrations
        run: |
          kubectl run migration-${{ github.sha }} \
            --image=${{ env.IMAGE_PREFIX }}-api:${{ github.sha }} \
            --namespace=producer-animation \
            --restart=Never \
            --rm \
            --attach \
            --env="DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" \
            -- pnpm --filter @producer/db migrate:deploy

      - name: Deploy services (rolling update)
        run: |
          IMAGE_TAG=${{ github.sha }}
          kubectl set image deployment/api api=${{ env.IMAGE_PREFIX }}-api:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/workflow-engine workflow-engine=${{ env.IMAGE_PREFIX }}-workflow-engine:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/ai-gateway ai-gateway=${{ env.IMAGE_PREFIX }}-ai-gateway:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/ai-workers ai-workers=${{ env.IMAGE_PREFIX }}-ai-workers:$IMAGE_TAG -n producer-animation
          kubectl set image deployment/web web=${{ env.IMAGE_PREFIX }}-web:$IMAGE_TAG -n producer-animation

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n producer-animation --timeout=10m
          kubectl rollout status deployment/workflow-engine -n producer-animation --timeout=10m
          kubectl rollout status deployment/web -n producer-animation --timeout=10m

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Production deploy ${{ job.status }}: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
