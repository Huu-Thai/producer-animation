# Kubernetes Secrets Template
# DO NOT commit actual secrets to version control.
# Use `kubectl create secret generic` or External Secrets Operator to populate.
#
# To create from environment:
#   kubectl create secret generic producer-animation-secrets \
#     --from-literal=JWT_SECRET="..." \
#     --from-literal=JWT_REFRESH_SECRET="..." \
#     ...
#
# Or use External Secrets Operator with AWS Secrets Manager:
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   ...

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: producer-animation-secrets
  namespace: producer-animation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: producer-animation-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: producer-animation/production
        property: JWT_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: producer-animation/production
        property: JWT_REFRESH_SECRET
    - secretKey: INTERNAL_SECRET
      remoteRef:
        key: producer-animation/production
        property: INTERNAL_SECRET
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: producer-animation/production
        property: ENCRYPTION_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: producer-animation/production
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: producer-animation/production
        property: REDIS_URL
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: producer-animation/production
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: producer-animation/production
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_S3_BUCKET
      remoteRef:
        key: producer-animation/production
        property: AWS_S3_BUCKET
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: producer-animation/production
        property: ANTHROPIC_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: producer-animation/production
        property: OPENAI_API_KEY
    - secretKey: LEONARDO_API_KEY
      remoteRef:
        key: producer-animation/production
        property: LEONARDO_API_KEY
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: producer-animation/production
        property: ELEVENLABS_API_KEY
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef:
        key: producer-animation/production
        property: YOUTUBE_CLIENT_ID
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef:
        key: producer-animation/production
        property: YOUTUBE_CLIENT_SECRET
    - secretKey: SENTRY_DSN
      remoteRef:
        key: producer-animation/production
        property: SENTRY_DSN
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: producer-animation/production
        property: SLACK_WEBHOOK_URL
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: producer-animation/production
        property: PAGERDUTY_ROUTING_KEY
---
# AWS Secrets Manager ClusterSecretStore
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
