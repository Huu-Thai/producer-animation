version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: producer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: producer
      POSTGRES_PASSWORD: producer
      POSTGRES_DB: producer_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U producer']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: producer_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: producer_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://producer:producer@postgres:5432/producer_db
      REDIS_URL: redis://redis:6379
      WORKFLOW_ENGINE_URL: http://workflow-engine:3002
      AI_GATEWAY_URL: http://ai-gateway:3003
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workflow-engine:
    build:
      context: ./apps/workflow-engine
      dockerfile: Dockerfile.dev
    container_name: producer_workflow
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://producer:producer@postgres:5432/producer_db
      REDIS_URL: redis://redis:6379
      AI_GATEWAY_URL: http://ai-gateway:3003
    env_file:
      - .env
    volumes:
      - ./apps/workflow-engine:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-gateway:
    build:
      context: ./apps/ai-gateway
      dockerfile: Dockerfile.dev
    container_name: producer_ai_gateway
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      WORKFLOW_ENGINE_URL: http://workflow-engine:3002
    env_file:
      - .env
    volumes:
      - ./apps/ai-gateway:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy

  ai-workers:
    build:
      context: ./apps/ai-workers
      dockerfile: Dockerfile
    container_name: producer_ai_workers
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://producer:producer@postgres:5432/producer_db
    env_file:
      - .env
    volumes:
      - ./apps/ai-workers:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    container_name: producer_flower
    restart: unless-stopped
    ports:
      - '5555:5555'
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: producer_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
